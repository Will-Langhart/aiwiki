name: freshness

# Weekly freshness pass over the catalog:
#   1. refresh — re-verify the stalest published tools against their own sites
#      (services/enrichment refresh mode). Verified changes auto-apply, land in
#      tool_changes and email watchers; the rest park as proposals for review.
#      Then rebuild the site so the prerendered pages pick up the new facts.
#   2. report — catalog-health report (freshness, duplicate candidates, dead or
#      redirected sites, review queue) in the job summary. Report-only.
#
# Spend is bounded by ENRICH_DAILY_COST_CAP_USD (summed across enrich_* features
# in llm_usage); a batch stops cleanly when it is reached. ~$0.08/tool.
#
# Secrets: ANTHROPIC_API_KEY, SUPABASE_URL, SUPABASE_SERVICE_ROLE_KEY,
# VERCEL_DEPLOY_HOOK_URL (optional — without it, deploy manually after a run).

on:
  schedule:
    - cron: "0 7 * * 1" # Mondays 07:00 UTC
  workflow_dispatch:
    inputs:
      batch:
        description: "Tools to refresh (most in need first)"
        default: "50"
      dry_run:
        description: "Run the graph and report diffs without writing"
        type: boolean
        default: false

concurrency:
  group: freshness
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh stale tools
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        working-directory: services/enrichment
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GITHUB_TOKEN: ${{ github.token }} # higher GitHub API limit for star counts
      ENRICH_DAILY_COST_CAP_USD: "5.0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/enrichment/pyproject.toml

      - name: Install enrichment service
        run: pip install -e .

      - name: Refresh batch
        run: |
          flags=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then flags="--dry-run"; fi
          enrich --refresh-batch "${{ inputs.batch || '50' }}" $flags > results.json

      - name: Summarize
        if: ${{ !cancelled() }}
        run: |
          [ -s results.json ] || { echo "No results." >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          jq -rs '
            "## Refresh batch\n",
            "| Status | Tools |", "|---|---:|",
            (group_by(.status)[] | "| \(.[0].status) | \(length) |"),
            "",
            "| Tool | Status | Changed | Why not applied |", "|---|---|---|---|",
            (.[] | "| \(.tool) | \(.status) | \((.changed_fields // []) | join(", ")) | \(((.reasons // []) + [(.error // empty)]) | join("; ") | gsub("\\|"; "/") | .[0:160]) |")
          ' results.json >> "$GITHUB_STEP_SUMMARY"
          echo "APPLIED=$(jq -s '[.[] | select(.status == "applied")] | length' results.json)" >> "$GITHUB_ENV"

      - name: Rebuild site
        if: ${{ env.APPLIED != '' && env.APPLIED != '0' && inputs.dry_run != true }}
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "::warning::$APPLIED tool(s) updated but VERCEL_DEPLOY_HOOK_URL is not set — deploy manually so prerendered pages pick them up."
            exit 0
          fi
          curl -fsS -X POST "$HOOK" > /dev/null
          echo "Triggered a production rebuild for $APPLIED updated tool(s)." >> "$GITHUB_STEP_SUMMARY"

  report:
    name: Catalog health report
    needs: refresh
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build report
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/freshness-report.ts >> "$GITHUB_STEP_SUMMARY"
